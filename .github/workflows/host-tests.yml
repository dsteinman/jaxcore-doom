name: Portable firmware tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  host-tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    env:
      CC: ${{ matrix.compiler }}
      UBSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S tests/host -B build/host -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build/host --parallel
      - run: ctest --test-dir build/host --output-on-failure
