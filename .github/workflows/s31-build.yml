name: S31 firmware build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set toolchain location
        run: echo "JAXCORE_TOOLS_ROOT=$RUNNER_TEMP/jaxcore-toolchains" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/setup_idf.py --tools-root "$JAXCORE_TOOLS_ROOT"
      - run: scripts/idf.sh build
      - run: python scripts/check_s31_elf.py
      - uses: actions/upload-artifact@v4
        with:
          name: jaxcore-s31-bringup-firmware
          path: |
            build/s31/jaxcore-doom.bin
            build/s31/jaxcore-doom.elf
            build/s31/bootloader/bootloader.bin
            build/s31/partition_table/partition-table.bin
            build/s31/verification.json
